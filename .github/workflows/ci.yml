name: Godown ERP CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Check server syntax
        run: |
          node --check server/src/server.js
          node --check server/src/models.js
          node --check server/src/crudRouter.js
          node --check server/src/auth.js
          node --check server/scripts/smoke-test.js

      - name: Run authenticated API smoke test
        working-directory: server
        env:
          PORT: 5000
          MONGODB_URI: mongodb://127.0.0.1:27017/godown_erp_ci
          CLIENT_ORIGIN: http://localhost:5173
          JWT_SECRET: ci-only-long-random-secret-for-godown-erp
          ADMIN_NAME: CI Admin
          ADMIN_EMAIL: ci-admin@example.com
          ADMIN_PASSWORD: ci-test-password-12345
          API_URL: http://127.0.0.1:5000/api
        run: |
          npm start > /tmp/godown-erp-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node scripts/smoke-test.js || { cat /tmp/godown-erp-server.log; exit 1; }
